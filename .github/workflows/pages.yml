# Published into krysof/eggy as .github/workflows/pages.yml.
name: Deploy EGGY client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'eggy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload EGGY client
        uses: actions/upload-pages-artifact@v3
        with:
          path: eggy
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
